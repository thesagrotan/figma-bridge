<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: stretch; justify-content: center;
        gap: 6px;
        padding: 10px;
        background: transparent;
        overflow: hidden;
        font-family: Inter, system-ui, -apple-system, sans-serif;
      }
      .row { display: flex; align-items: center; gap: 8px; }
      .dot {
        flex: none;
        width: 14px; height: 14px;
        border-radius: 50%;
        background: #94a3b8;
        transition: background 0.3s ease;
      }
      .dot.connected { background: #10b981; }
      .dot.busy      { background: #f59e0b; animation: pulse 0.8s ease-in-out infinite alternate; }
      .dot.error     { background: #ef4444; }
      .dot.http      { background: #818cf8; }
      input {
        flex: 1; min-width: 0; height: 28px;
        padding: 0 8px;
        border: 1px solid #cbd5e1; border-radius: 6px;
        background: #fff; color: #0f172a;
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      input:focus { outline: 2px solid #93c5fd; outline-offset: -1px; }
      button {
        flex: none; height: 28px; padding: 0 12px;
        border: 1px solid #0f172a; border-radius: 6px;
        background: #0f172a; color: #fff;
        font: 600 12px Inter, system-ui, sans-serif;
        cursor: pointer;
      }
      button:hover { background: #1e293b; }
      .hint { font-size: 10px; color: #64748b; }
      @keyframes pulse {
        from { opacity: 1; }
        to   { opacity: 0.45; }
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="dot" id="dot"></div>
      <input id="token" type="password" placeholder="Bridge token" autocomplete="off" spellcheck="false" />
      <button id="save" type="button">Save</button>
    </div>
    <div class="hint">Token: ~/.figma-mcp-unchained/token</div>
    <script>
      const CANDIDATE_PORTS = [3000,3001,3002,3003,3004,3005,3006,3007,3008,3009,3010,31337];
      const dot = document.getElementById("dot");
      const tokenInput = document.getElementById("token");
      const saveButton = document.getElementById("save");

      // safeStorage: in-memory fallback for Figma iframe (localStorage blocked)
      const memoryStorage = {};
      const safeStorage = {
        getItem(key) {
          try { return window.localStorage ? window.localStorage.getItem(key) : memoryStorage[key] ?? null; }
          catch { return memoryStorage[key] ?? null; }
        },
        setItem(key, val) {
          memoryStorage[key] = val;
          try { if (window.localStorage) window.localStorage.setItem(key, val); } catch {}
          try {
            parent.postMessage({ pluginMessage: { type: "save_storage", [key === "figma_mcp_unchained_port" ? "port" : "token"]: val } }, "*");
          } catch {}
        }
      };

      let currentPort = parseInt(safeStorage.getItem("figma_mcp_unchained_port") || "3000", 10);
      if (isNaN(currentPort) || currentPort < 1) currentPort = 3000;
      let currentToken = safeStorage.getItem("figma_mcp_unchained_token") ?? "";
      let session = null;

      tokenInput.value = currentToken;

      function setStatus(state) {
        dot.className = "dot " + state;
      }

      function getEndpoint(port = currentPort) {
        return "http://localhost:" + port;
      }

      function requestSession() {
        try { parent.postMessage({ pluginMessage: { type: "get_session" } }, "*"); } catch {}
      }

      function sendHello() {
        if (!session || !ws || ws.readyState !== WebSocket.OPEN) return;
        try {
          ws.send(JSON.stringify({
            type: "hello",
            sessionId: session.sessionId,
            fileName: session.fileName,
            pageName: session.pageName,
          }));
        } catch {}
      }

      let ws = null;
      let isWsConnected = false;
      let consecutiveErrors = 0;
      let isPolling = false;

      let pollTimer = null;
      function schedulePoll(delayMs = 1000) {
        if (isWsConnected) return;
        clearTimeout(pollTimer);
        pollTimer = setTimeout(poll, delayMs);
      }

      function connectWebSocket() {
        if (ws) { try { ws.close(); } catch {} ws = null; }
        isWsConnected = false;
        if (!currentToken) {
          setStatus("error");
          return;
        }
        try {
          const socket = new WebSocket(`ws://localhost:${currentPort}?token=${encodeURIComponent(currentToken)}`);
          ws = socket;

          socket.onopen = () => {
            if (ws !== socket) return;
            isWsConnected = true;
            consecutiveErrors = 0;
            clearTimeout(pollTimer);
            setStatus("connected");
            if (session) sendHello();
            else requestSession();
          };

          socket.onmessage = (event) => {
            try {
              const data = JSON.parse(event.data);
              if (data && data.type === "command" && data.command) {
                setStatus("busy");
                data.command.__startTime = Date.now();
                parent.postMessage({ pluginMessage: { type: "execute", command: data.command } }, "*");
              }
            } catch {}
          };

          socket.onclose = () => {
            if (ws !== socket) return;
            if (isWsConnected) setStatus("http");
            isWsConnected = false;
            // Clear the reference so the poll loop can dial a fresh socket.
            ws = null;
            schedulePoll(1000);
          };

          socket.onerror = () => {
            if (ws !== socket) return;
            isWsConnected = false;
            ws = null;
            schedulePoll(2000);
          };
        } catch {
          isWsConnected = false;
          schedulePoll(2000);
        }
      }

      function reconnect() {
        clearTimeout(pollTimer);
        connectWebSocket();
        poll();
      }

      let isScanning = false;
      async function autoDetectPort() {
        if (isScanning || !currentToken) return null;
        isScanning = true;
        const portsToTry = [currentPort, ...CANDIDATE_PORTS.filter(p => p !== currentPort)];
        for (const p of portsToTry) {
          try {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 350);
            const res = await fetch(`http://localhost:${p}/health`, {
              headers: { "X-Bridge-Token": currentToken },
              signal: controller.signal
            });
            clearTimeout(timer);
            if (res.ok) {
              const data = await res.json();
              if (data && data.name === "figma-mcp-unchained") {
                currentPort = p;
                safeStorage.setItem("figma_mcp_unchained_port", String(p));
                isScanning = false;
                connectWebSocket();
                return p;
              }
            }
          } catch {}
        }
        isScanning = false;
        return null;
      }

      async function poll() {
        if (isWsConnected) return;
        if (isPolling) return;
        if (!currentToken) { setStatus("error"); return; }
        isPolling = true;

        try {
          const response = await fetch(getEndpoint() + "/commands", {
            headers: { "X-Bridge-Token": currentToken },
          });

          if (!response.ok) {
            if (response.status === 401) setStatus("error");
            else throw new Error();
          } else {
            consecutiveErrors = 0;
            const data = await response.json();
            const commands = Array.isArray(data) ? data : (data ? [data] : []);

            if (commands.length > 0) {
              setStatus("busy");
              for (const command of commands) {
                command.__startTime = Date.now();
                parent.postMessage({ pluginMessage: { type: "execute", command } }, "*");
              }
            } else {
              setStatus("http");
            }

            if (!isWsConnected && !ws) connectWebSocket();
          }
        } catch {
          consecutiveErrors++;
          if (consecutiveErrors >= 3) {
            const detected = await autoDetectPort();
            if (!detected) setStatus("error");
          }
        } finally {
          isPolling = false;
          if (!isWsConnected) schedulePoll(1000);
        }
      }

      saveButton.addEventListener("click", () => {
        const next = tokenInput.value.trim();
        if (!next) {
          setStatus("error");
          tokenInput.focus();
          return;
        }
        currentToken = next;
        tokenInput.value = next;
        safeStorage.setItem("figma_mcp_unchained_token", next);
        reconnect();
      });

      window.onmessage = async (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;

        if (message.type === "init_storage") {
          if (message.port) { currentPort = parseInt(message.port, 10) || 3000; safeStorage.setItem("figma_mcp_unchained_port", String(currentPort)); }
          if (message.token) {
            currentToken = message.token;
            tokenInput.value = currentToken;
            reconnect();
          }
          return;
        }

        if (message.type === "session") {
          session = message;
          sendHello();
          return;
        }

        if (message.type === "result") {
          if (isWsConnected && ws && ws.readyState === WebSocket.OPEN) {
            try {
              ws.send(JSON.stringify({ type: "result", id: message.id, result: message.result }));
              setStatus("connected");
              return;
            } catch {}
          }
          try {
            await fetch(`${getEndpoint()}/results/${message.id}`, {
              method: "POST",
              headers: { "Content-Type": "application/json", "X-Bridge-Token": currentToken },
              body: JSON.stringify(message.result),
            });
            setStatus(isWsConnected ? "connected" : "http");
          } catch {
            setStatus("error");
          }
        }
      };

      if (currentToken) {
        connectWebSocket();
        poll();
      } else {
        setStatus("error");
      }
      requestSession();
    </script>
  </body>
</html>
