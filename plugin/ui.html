<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
        background: transparent;
        overflow: hidden;
      }
      .dot {
        width: 20px; height: 20px;
        border-radius: 50%;
        background: #94a3b8;
        transition: background 0.3s ease;
      }
      .dot.connected { background: #10b981; }
      .dot.busy      { background: #f59e0b; animation: pulse 0.8s ease-in-out infinite alternate; }
      .dot.error     { background: #ef4444; }
      .dot.http      { background: #818cf8; }

      @keyframes pulse {
        from { opacity: 1; }
        to   { opacity: 0.45; }
      }
    </style>
  </head>
  <body>
    <div class="dot" id="dot"></div>
    <script>
      const CANDIDATE_PORTS = [3000,3001,3002,3003,3004,3005,3006,3007,3008,3009,3010,31337];
      const dot = document.getElementById("dot");

      // safeStorage: in-memory fallback for Figma iframe (localStorage blocked)
      const memoryStorage = {};
      const safeStorage = {
        getItem(key) {
          try { return window.localStorage ? window.localStorage.getItem(key) : memoryStorage[key] ?? null; }
          catch { return memoryStorage[key] ?? null; }
        },
        setItem(key, val) {
          memoryStorage[key] = val;
          try { if (window.localStorage) window.localStorage.setItem(key, val); } catch {}
          try {
            parent.postMessage({ pluginMessage: { type: "save_storage", [key === "figma_mcp_bridge_port" ? "port" : "token"]: val } }, "*");
          } catch {}
        }
      };

      let currentPort = parseInt(safeStorage.getItem("figma_mcp_bridge_port") || "3000", 10);
      if (isNaN(currentPort) || currentPort < 1) currentPort = 3000;
      let currentToken = safeStorage.getItem("figma_mcp_bridge_token") ?? "local-development-token";

      function setStatus(state) {
        dot.className = "dot " + state;
      }

      function getEndpoint(port = currentPort) {
        return "http://localhost:" + port;
      }

      let ws = null;
      let isWsConnected = false;
      let consecutiveErrors = 0;
      let isPolling = false;

      function connectWebSocket() {
        if (ws) { try { ws.close(); } catch {} ws = null; }
        try {
          ws = new WebSocket(`ws://localhost:${currentPort}?token=${encodeURIComponent(currentToken)}`);

          ws.onopen = () => {
            isWsConnected = true;
            consecutiveErrors = 0;
            setStatus("connected");
          };

          ws.onmessage = (event) => {
            try {
              const data = JSON.parse(event.data);
              if (data && data.type === "command" && data.command) {
                setStatus("busy");
                data.command.__startTime = Date.now();
                parent.postMessage({ pluginMessage: { type: "execute", command: data.command } }, "*");
              }
            } catch {}
          };

          ws.onclose = () => {
            if (isWsConnected) setStatus("http");
            isWsConnected = false;
          };

          ws.onerror = () => { isWsConnected = false; };
        } catch { isWsConnected = false; }
      }

      let isScanning = false;
      async function autoDetectPort() {
        if (isScanning) return null;
        isScanning = true;
        const portsToTry = [currentPort, ...CANDIDATE_PORTS.filter(p => p !== currentPort)];
        for (const p of portsToTry) {
          try {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 350);
            const res = await fetch(`http://localhost:${p}/health`, {
              headers: { "X-Bridge-Token": currentToken },
              signal: controller.signal
            });
            clearTimeout(timer);
            if (res.ok) {
              const data = await res.json();
              if (data && data.name === "figma-bridge") {
                currentPort = p;
                safeStorage.setItem("figma_mcp_bridge_port", String(p));
                isScanning = false;
                connectWebSocket();
                return p;
              }
            }
          } catch {}
        }
        isScanning = false;
        return null;
      }

      async function poll() {
        if (isWsConnected) { setTimeout(poll, 1000); return; }
        if (isPolling) return;
        isPolling = true;

        try {
          const response = await fetch(getEndpoint() + "/commands", {
            headers: { "X-Bridge-Token": currentToken },
          });

          if (!response.ok) {
            if (response.status === 401) setStatus("error");
            else throw new Error();
          } else {
            consecutiveErrors = 0;
            const data = await response.json();
            const commands = Array.isArray(data) ? data : (data ? [data] : []);

            if (commands.length > 0) {
              setStatus("busy");
              for (const command of commands) {
                command.__startTime = Date.now();
                parent.postMessage({ pluginMessage: { type: "execute", command } }, "*");
              }
            } else {
              setStatus("http");
            }

            if (!isWsConnected && !ws) connectWebSocket();
          }
        } catch {
          consecutiveErrors++;
          if (consecutiveErrors >= 3) {
            const detected = await autoDetectPort();
            if (!detected) setStatus("error");
          }
        } finally {
          isPolling = false;
          setTimeout(poll, isWsConnected ? 1000 : 500);
        }
      }

      window.onmessage = async (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;

        if (message.type === "init_storage") {
          if (message.port) { currentPort = parseInt(message.port, 10) || 3000; safeStorage.setItem("figma_mcp_bridge_port", String(currentPort)); }
          if (message.token) { currentToken = message.token; safeStorage.setItem("figma_mcp_bridge_token", message.token); }
          return;
        }

        if (message.type === "result") {
          if (isWsConnected && ws && ws.readyState === WebSocket.OPEN) {
            try {
              ws.send(JSON.stringify({ type: "result", id: message.id, result: message.result }));
              setStatus("connected");
              return;
            } catch {}
          }
          try {
            await fetch(`${getEndpoint()}/results/${message.id}`, {
              method: "POST",
              headers: { "Content-Type": "application/json", "X-Bridge-Token": currentToken },
              body: JSON.stringify(message.result),
            });
            setStatus(isWsConnected ? "connected" : "http");
          } catch {
            setStatus("error");
          }
        } else if (message.type === "generation_done") {
          setStatus(isWsConnected ? "connected" : "http");
        }
      };

      connectWebSocket();
      poll();
    </script>
  </body>
</html>
